<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab4task3</title>
</head>
<body>
    
    <form>
        <h1>My feedback form</h1>
        <ul>
            <li>
                <label>Name:</label>
                <input type="text" required> 
            </li>

            <li>
                <label>Email:</label>
                <input type="email" required>
            </li>

            <li>
                <label>Password:</label>
                <input type="password" required>
            </li> 
             <li>
                Please Check all the emotions that apply to you:
                <ul>
                    <li>
                        <label>Angry</label>
                        <input type="checkbox">
                    </li>
                    
                    <li>
                        <label>Sad</label>
                        <input type="checkbox">
                    </li>

                     <li>
                        <label>Happy</label>
                        <input type="checkbox">
                    </li>

                     <li>
                        <label>Ambivalent</label>
                        <input type="checkbox">
                    </li>

                </ul>
            </li>

            <li>
                How satisfied were you with our service?

                <ul>
                    <li>
                        <label>Very Satisfied</label>
                        <input type="checkbox">
                    </li> 

                     <li>
                        <label>Satisfied</label>
                        <input type="checkbox">
                    </li> 

                     <li>
                        <label>Didn't care</label>
                        <input type="checkbox">
                    </li> 
                     
                     <li>
                        <label>Dissatisfied</label>
                        <input type="checkbox">
                    </li>

                     <li>
                        <label>Very dissatisfied</label>
                        <input type="checkbox">
                    </li>

                </ul>

            </li>

            <li>
                <label >Further comments:</label>
                <textarea></textarea> 
            </li>

            <li>
                <label >Bio photo:</label>
                <input type="file">
            </li>

            <li>
                <label>Location visited</label>
                <select>
                    <option value="">Select Location</option>
                    <option >TN</option>
                    <option>KL</option>
                    <option >TN</option>
                    <option >KT</option>
                    <option >HP</option>
                    <option >DL</option>
                    <option >MP</option>
                    <option >WB</option>
                 </select>
            </li>
            <li>
                <button>submit</button>
            </li>
             
        </ul>
    </form>
    
</body>
</html>
