        }

        .M {
            color: rgb(255, 255, 255);
            display: inline-block;
            text-shadow: 5px 5px 1px rgb( 0,0,0);
            opacity: 0.8;
            transition: 0.2s ease;

        }

        .M:hover {
            color: rgb(255, 129, 39);
            animation: shake 0.4s ease-in-out;
            animation-iteration-count: 1.5;

        }

        .a {
            color:white;
            display: inline-block;
            text-shadow: 5px 5px 1px rgb( 0,0,0);
            opacity: 0.8;

        }

        .a:hover {

            animation-iteration-count: 1.5;
        }

        }

        .B {

        }

        .B:hover {

        .o {

        }

            animation: shake 0.4s ease-in-out;
            animation-iteration-count: 1.5;
        }


        .T {
            color: white;
            text-shadow: 5px 5px 1px rgb( 0,0,0);
            display: inline-block;
            opacity: 0.8;
            transition: 0.2s ease;

        }

        .T:hover {
            color: rgba(0, 8, 245, 0.978);
            animation: shake 0.4s ease-in-out;
            animation-iteration-count: 1.5;
        }

        .find {
            display: grid;
            grid-template-columns: auto auto;
            justify-content: center;
            /* border: 1px solid rgba(255, 255, 255, 0.1); */
            margin-left: 200px;
            margin-right: 200px;
            padding-left: 20%;
            padding-bottom: -10%;
            padding-top: -20%;
            padding-right: 20%;
            /* backdrop-filter: blur(15px) ; */
            /* border-radius: 10px;
            background: transparent; */



        }

        .rbt {
            margin-left: 494px;
            margin-top: 116px;
            width: 250px;
            height: 250px;
            position: absolute;
            opacity: 0.9;
            z-index: 1;
            filter: drop-shadow(10px 5px 5px rgba(17, 17, 17, 0.938));

        }

        .find a {

            padding: 50px 50px;


        }



        button {

            width: 300px;
            height: 40px;
            text-align: center;
            margin: 10px 10px;
            font-family: inherit;
            font-size: 20px;
            color: rgb(255, 250, 250);
            font-weight: 500;
            border: 1px solid rgb(255, 255, 255,0.5);
            border-radius: .5rem;
            letter-spacing: 0.5px;
            padding-top: .375rem;
            padding-bottom: .375rem;
            padding-right: 1rem;
            padding-left: 1rem;
            background-color: transparent;
            cursor: pointer;
            backdrop-filter: blur(10px);
        
        }

        button:hover {
            color:pink;
            transform: scale(1.05);
            transition: 0.1s ease;
            border: 1.5px solid violet;
            background-color: rgba(255, 255, 255, 0.2);

        }

       



        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-4px) rotate(-5deg);
            }

            40% {
                transform: translateX(4px) rotate(5deg);
            }

            60% {
                transform: translateX(-4px) rotate(-3deg);
            }

            80% {
                transform: translateX(4px) rotate(3deg);
            }

            100% {
                transform: translateX(0);
            }
        }
        

     
    </style>
