        <h2> <span id="p">P</span><span id="o">o</span><span id="s">s</span><span id="ps"><sup>+</sup></span> <span id="o">o</span><span id="r">R</span> <span id="n">N</span><span id="e">e</span></span><span id="g">g</span><span id="ng"><sup>-</sup></span><img class="rbt" src="toppng.com-free-png-robot-png-images-transparent-robot-transparent-background-850x762.png"  height="70px" width="70px"> </h2>

    <div class="content">
        <form action="" name="sign">

            
            <input type="text" id="input2" placeholder="Enter a Number"> <br>
            <button type="button" onclick="checksign()">Check</button> <button class="home-btn"><a href="index.html">Home</a></button>
            <br>
          <input class="out2" type="text" name=""  id="output2" readonly>
        </form>

        <script>
          
          
          
          function checksign() {

               let a = document.sign.input2.value;

               if (a.trim()=="") {
                    output2.value = "Enter a Number";
               }
               else if (a<0) {
                    output2.value = "Negative";
               }
               else if (isNaN(a)) {
                    output2.value = "Enter Number only";
               }
               
               else if (a==0) {
                    output2.value = "Neither positive nor negative"
               }

               else {
                    output2.value = "Positive"
               }
          }
          

        </script>
