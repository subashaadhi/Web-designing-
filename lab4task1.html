<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="color: blue;">Please complete our survey</h1>
    <h3>Contact information</h3>
    <table>
        <form>
            <tr>
                <td style="color: blue;">Email address:</td>
                <td><input type="text" required></td>
            </tr>

            <tr>
                <td style="color: blue;">First name:</td>
                <td><input type="text" name="" id="" required></td>

            </tr>

            <tr>
                <td style="color: blue;">Last name:</td>
                <td><input type="text" name="" id="" required></td>
            </tr>
        </form>
    </table>

    <h3>Geographic information</h3>
    <table>
        <form>
            <tr>
                <td style="color: blue;">State:</td>
                <td><input type="text" name="" id="" placeholder="Two characters"></td> 
            </tr>

            <tr>
                <td style="color: blue;">Zip code:</td>
                <td><input type="text" name="" id="" placeholder="Five digits"></td>
            </tr>
        </form>
    </table>

    <h3>How did you hear about us?</h3>

    <table>
        <form action="">
            <tr>
                <td style="color: blue;">Websearch:</td>
                <td><input type="checkbox"></td>
            </tr>
            <tr>
                <td style="color: blue;">Facebook:</td>
                <td><input type="checkbox"></td>
            </tr>

            <tr>
                <td style="color: blue;">Twitter:</td>
                <td><input type="checkbox"></td>
            </tr>

            <tr>
                <td style="color: blue;">Email Message:</td>
                <td><input type="checkbox"></td>
            </tr>
        </form>
    </table>

    <h3>Thank you for taking survey!</h3>

    <form align="center">
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>

</body>
</html>
